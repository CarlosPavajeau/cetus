quarkus.application.name=cetus-api
quarkus.http.port=${PORT:8080}
# Railway's private network is IPv6: listen on every interface (dual stack) in production.
%prod.quarkus.http.host=::
# JSON logs in production so Railway can filter by level and logger; plain text locally and in tests.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
# Railway's output only keeps warnings and errors, enough for a failed start; every level goes to Grafana (OTLP).
%prod.quarkus.log.console.level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.agroal".level=WARN
quarkus.log.category."software.amazon.awssdk".level=WARN

# --- Telemetry: traces, metrics and logs over OTLP (Grafana Cloud in production; grafana/otel-lgtm locally,
# `mise run infra-otel`). Production sets QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT and _HEADERS (write-only token).
# AGENTS.md (Telemetry) lists the attributes allowed in metrics and the data that never goes in telemetry.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
quarkus.otel.resource.attributes=service.version=${CETUS_COMMIT_SHA:dev},deployment.environment.name=${CETUS_DEPLOYMENT_ENV:development}
quarkus.otel.logs.enabled=true
# Follows the caller's decision; of the rest, keeps this share.
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${CETUS_OTEL_TRACE_RATIO:0.25}
# The token in their path is the credential (one-time links), and a span would keep it in url.path.
quarkus.otel.traces.suppress-application-uris=console/certificate-uploads*,console/contact-verifications*
quarkus.micrometer.binder.jvm=true
# Each series costs: Netty's allocator tells nothing Railway does not; the database pool does. Vert.x stays on:
# the HTTP server metrics come through it.
quarkus.micrometer.binder.netty.enabled=false
quarkus.datasource.metrics.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
# Off locally unless the LGTM container is up, so dev mode does not log failed exports. Both services share that
# container instead of each starting its own Dev Service. Only dev and tests: the extension is not in the
# production build, which would warn about an unknown key.
%dev,test.quarkus.observability.enabled=false
%dev.quarkus.otel.sdk.disabled=${CETUS_OTEL_DISABLED:true}
%dev.quarkus.otel.metric.export.interval=10s
%dev.quarkus.otel.traces.sampler.arg=1.0
%test.quarkus.otel.sdk.disabled=true

# --- Database (PlanetScale Postgres in prod, docker compose in dev) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
# Not set for %test, which gets its own database from Dev Services.
%dev,prod.quarkus.datasource.jdbc.url=${CETUS_DB_URL:jdbc:postgresql://localhost:5432/cetus}
%dev,prod.quarkus.datasource.username=${CETUS_DB_USER:cetus_billing}
%dev,prod.quarkus.datasource.password=${CETUS_DB_PASSWORD:cetus}
# In production CETUS_DB_URL goes through PlanetScale's PgBouncer (port 6432, transaction mode): the direct
# connections (5432) are few and each deploy briefly runs two containers. Nothing here keeps session state,
# and PgBouncer tracks pgjdbc's prepared statements (max_prepared_statements).
quarkus.datasource.jdbc.max-size=10
# Opening a connection to the database (TLS + SCRAM) costs hundreds of ms: keep some open, even when idle,
# so the first request after a quiet spell does not pay for it.
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2
# Lines and taxes of a document go to the database in one batch instead of one round trip each.
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.database.default-schema=billing
quarkus.hibernate-orm.schema-management.strategy=none

# Only the API runs migrations. Prefer running them as a pre-deploy step in Railway.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=billing
# Flyway holds a session-level advisory lock and runs DDL, so it needs a direct connection (port 5432) when
# CETUS_DB_URL goes through PgBouncer. Empty: the datasource's URL, with its own connection outside the pool.
%dev,prod.quarkus.flyway.jdbc-url=${CETUS_DB_MIGRATION_URL:}
%dev,prod.quarkus.flyway.username=${CETUS_DB_USER:cetus_billing}
%dev,prod.quarkus.flyway.password=${CETUS_DB_PASSWORD:cetus}

# --- Security ---
# /v1/** uses API keys (ApiKeyFilter). /console/** and /admin/** use JWTs issued by Better Auth (console
# BFF). On /admin/** each endpoint also names the platform roles it allows (the JWT's "groups" claim).
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.console.paths=/console/*,/admin/*
quarkus.http.auth.permission.console.policy=authenticated
# One-time certificate upload and contact verification links: the token in the path is the credential
# (CertificateUploadResource, ContactVerificationResource).
quarkus.http.auth.permission.certificate-uploads.paths=/console/certificate-uploads/*,/console/contact-verifications/*
quarkus.http.auth.permission.certificate-uploads.policy=permit
mp.jwt.verify.publickey.location=${CETUS_AUTH_JWKS_URL:http://localhost:3000/.well-known/jwks.json}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=${CETUS_AUTH_ISSUER:http://localhost:3000}
mp.jwt.verify.audiences=cetus-api
# /console/**, /admin/** and /q/** only answer these hosts (Railway's private network, local runs and Railway's
# health check); through the public domain they are 404. "*.suffix" matches any subdomain.
cetus.private-hosts=*.railway.internal,localhost,127.0.0.1,[::1],healthcheck.railway.app
# Per API key on /v1/**: this many requests at once, refilled at this rate. Above it: 429 with Retry-After.
cetus.rate-limit.requests-per-second=${CETUS_RATE_LIMIT_REQUESTS_PER_SECOND:10}
cetus.rate-limit.burst=${CETUS_RATE_LIMIT_BURST:20}
# SANDBOX keys: lower, since anyone can get one without setting anything up.
cetus.rate-limit.sandbox.requests-per-second=${CETUS_SANDBOX_RATE_LIMIT_REQUESTS_PER_SECOND:5}
cetus.rate-limit.sandbox.burst=${CETUS_SANDBOX_RATE_LIMIT_BURST:10}
# API keys and accounts seen in the last 30 s, and issuers known to have their DIAN credentials. Keep each
# above the keys or issuers in use: an LRU visited in rotation by more keys than it holds misses on every access.
cetus.cache.access.max-entries=${CETUS_CACHE_ACCESS_MAX_ENTRIES:4096}
cetus.cache.issuers.max-entries=${CETUS_CACHE_ISSUERS_MAX_ENTRIES:1024}
# Documents an account may issue in the SANDBOX a day (Colombia time). Above it: 429 sandbox_daily_limit.
cetus.sandbox.daily-documents=${CETUS_SANDBOX_DAILY_DOCUMENTS:200}
# SANDBOX issuers an account may have, the sample included. Above it: 422 sandbox_issuer_limit.
cetus.sandbox.max-issuers=${CETUS_SANDBOX_MAX_ISSUERS:5}
# RFC 9457 "type" of every error: this base + the error code (e.g. https://docs.example.com/errors/).
# Unset: about:blank, until there is a page documenting each code.
#cetus.api.problem-type-base=

# --- AWS ---
cetus.aws.region=${AWS_REGION:us-east-1}
cetus.aws.kms-key-id=${CETUS_KMS_KEY_ID:alias/cetus}
cetus.storage.bucket=${CETUS_DOCUMENTS_BUCKET:cetus-documents}
%dev.cetus.aws.endpoint-override=http://localhost:4566

# Presigned download URLs (GET /v1/{invoices|credit-notes}/{id}/files/{file}) expire after this long.
cetus.storage.download-ttl=PT5M

# --- Resend delivery events (POST /internal/email-events) ---
# Signing secret of the webhook (whsec_...), only from the environment. Without it the endpoint answers
# 503. In dev mode Quarkus also reads it from apps/api/.env (git-ignored, see .env.example).
cetus.email.webhook-secret=${RESEND_WEBHOOK_SECRET:}

# --- CORS: only the docs site calls the API from a browser, to try requests with a sandbox key ---
# /console/**, /admin/** and /q/** stay unreachable through the public domain (PrivatePaths).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CETUS_DOCS_ORIGIN:https://cetus-docs.cantte.com}
%dev,test.quarkus.http.cors.origins=http://localhost:3001,http://127.0.0.1:3001
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key
quarkus.http.cors.exposed-headers=X-Request-Id,Idempotent-Replayed,Retry-After
quarkus.http.cors.access-control-max-age=24H
# Keys travel in Authorization, never in cookies.
quarkus.http.cors.access-control-allow-credentials=false

# --- Webhooks to integrators ---
# Endpoints on localhost or private addresses are refused (SSRF), except in development and tests.
cetus.webhooks.allow-private-targets=false
%dev,test.cetus.webhooks.allow-private-targets=true

# --- OpenAPI: the console generates its TypeScript types from it, and the docs site publishes its /v1 part.
# Info, servers, tags, shared responses and examples live in META-INF/openapi.yaml.
quarkus.smallrye-openapi.store-schema-directory=build/openapi
quarkus.smallrye-openapi.operation-id-strategy=CLASS_METHOD
mp.openapi.filter=com.cantte.cetus.api.openapi.OpenApiFilter

# --- Tests: fresh Postgres from Dev Services (audit_log is append-only, so tests never reuse a database)
# and JWTs signed with a test-only key (src/test/resources/test-jwt). KMS and S3 are replaced by fakes.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:18
%test.mp.jwt.verify.publickey.location=test-jwt/public.pem
%test.mp.jwt.verify.issuer=https://console.test
%test.smallrye.jwt.sign.key.location=test-jwt/private.pem
# Not a real secret: signs the fake Resend events of EmailEventResourceTest.
%test.cetus.email.webhook-secret=whsec_Y2V0dXMtdGVzdC1vbmx5LXdlYmhvb2stc2VjcmV0IQ==
# Three, so SandboxIssuerTest reaches the daily limit of SANDBOX documents.
%test.cetus.sandbox.daily-documents=3
