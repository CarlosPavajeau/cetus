quarkus.application.name=cetus-api
quarkus.http.port=${PORT:8080}

# --- Database (PlanetScale Postgres in prod, docker compose in dev) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
# Not set for %test, which gets its own database from Dev Services.
%dev,prod.quarkus.datasource.jdbc.url=${CETUS_DB_URL:jdbc:postgresql://localhost:5432/cetus}
%dev,prod.quarkus.datasource.username=${CETUS_DB_USER:cetus_billing}
%dev,prod.quarkus.datasource.password=${CETUS_DB_PASSWORD:cetus}
quarkus.datasource.jdbc.max-size=10
quarkus.hibernate-orm.database.default-schema=billing
quarkus.hibernate-orm.database.generation=none

# Only the API runs migrations. Prefer running them as a pre-deploy step in Railway.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=billing

# --- Security ---
# /v1/** uses API keys (ApiKeyFilter). /console/** uses JWTs issued by Better Auth (console BFF).
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.console.paths=/console/*
quarkus.http.auth.permission.console.policy=authenticated
mp.jwt.verify.publickey.location=${CETUS_AUTH_JWKS_URL:http://localhost:3000/api/auth/jwks}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=${CETUS_AUTH_ISSUER:http://localhost:3000}
mp.jwt.verify.audiences=cetus-api

# --- AWS ---
cetus.aws.region=${AWS_REGION:us-east-1}
cetus.aws.kms-key-id=${CETUS_KMS_KEY_ID:alias/cetus}
cetus.storage.bucket=${CETUS_DOCUMENTS_BUCKET:cetus-documents}
%dev.cetus.aws.endpoint-override=http://localhost:4566

# Presigned download URLs (GET /v1/{invoices|credit-notes}/{id}/files/{file}) expire after this long.
cetus.storage.download-ttl=PT5M

# --- Resend delivery events (POST /internal/email-events) ---
# Signing secret of the webhook (whsec_...), only from the environment. Without it the endpoint answers
# 503. In dev mode Quarkus also reads it from apps/api/.env (git-ignored, see .env.example).
cetus.email.webhook-secret=${RESEND_WEBHOOK_SECRET:}

# --- OpenAPI (consumed by the console to generate TypeScript types) ---
quarkus.smallrye-openapi.info-title=Cetus API
quarkus.smallrye-openapi.store-schema-directory=build/openapi
quarkus.smallrye-openapi.operation-id-strategy=CLASS_METHOD
mp.openapi.filter=com.cantte.cetus.api.openapi.OpenApiFilter

# --- Tests: fresh Postgres from Dev Services (audit_log is append-only, so tests never reuse a database)
# and JWTs signed with a test-only key (src/test/resources/test-jwt). KMS and S3 are replaced by fakes.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.mp.jwt.verify.publickey.location=test-jwt/public.pem
%test.mp.jwt.verify.issuer=https://console.test
%test.smallrye.jwt.sign.key.location=test-jwt/private.pem
# Not a real secret: signs the fake Resend events of EmailEventResourceTest.
%test.cetus.email.webhook-secret=whsec_Y2V0dXMtdGVzdC1vbmx5LXdlYmhvb2stc2VjcmV0IQ==
