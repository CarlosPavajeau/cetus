quarkus.application.name=cetus-worker
quarkus.http.port=${PORT:8081}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
# Not set for %test, which gets its own database from Dev Services.
%dev,prod.quarkus.datasource.jdbc.url=${CETUS_DB_URL:jdbc:postgresql://localhost:5432/cetus}
%dev,prod.quarkus.datasource.username=${CETUS_DB_USER:cetus_billing}
%dev,prod.quarkus.datasource.password=${CETUS_DB_PASSWORD:cetus}
quarkus.datasource.jdbc.max-size=10
quarkus.hibernate-orm.database.default-schema=billing
quarkus.hibernate-orm.database.generation=none

# --- Job runner ---
cetus.jobs.poll-interval=2s
cetus.jobs.batch-size=5
cetus.jobs.lease=PT5M

# --- DIAN ---
cetus.dian.connect-timeout=PT10S
cetus.dian.request-timeout=PT60S
# Points the TEST environment to the local mock: CETUS_DIAN_TEST_URL=http://localhost:8090/WcfDianCustomerServices.svc
cetus.dian.test-url=${CETUS_DIAN_TEST_URL:}
# Technology provider data. Leave empty while operating as "software propio".
# cetus.provider.nit=
# cetus.provider.check-digit=
# cetus.provider.file-code=

# --- Delivery to the customer (Resend) ---
# Secrets only come from the environment: RESEND_API_KEY (send-only key, one per environment) and the
# sender, e.g. CETUS_EMAIL_FROM="Facturas <facturas@facturas.example.com>". Without both, deliveries are
# SKIPPED. In dev mode Quarkus also reads them from apps/worker/.env (git-ignored, see .env.example).
cetus.email.resend.api-key=${RESEND_API_KEY:}
cetus.email.resend.base-url=https://api.resend.com
cetus.email.from=${CETUS_EMAIL_FROM:}
# TEST documents go to this mailbox instead of the customer; without it they are not emailed.
cetus.email.test-recipient=${CETUS_EMAIL_TEST_RECIPIENT:}
cetus.email.connect-timeout=PT10S
cetus.email.read-timeout=PT30S
# Resend answers 429 above its rate limit without a Retry-After the SDK exposes; wait this long.
cetus.email.rate-limit-delay=PT2S
# Printed on the PDF. cetus.provider.name defaults to the issuer ("software propio").
cetus.provider.software-name=Cetus
# cetus.provider.name=

# --- Webhooks to integrators ---
cetus.webhooks.connect-timeout=PT5S
cetus.webhooks.request-timeout=PT10S
# Endpoints resolving to loopback, private or link-local addresses are refused (SSRF), except in
# development and tests, where receivers run on localhost.
cetus.webhooks.allow-private-targets=false
%dev,test.cetus.webhooks.allow-private-targets=true
%test.cetus.webhooks.request-timeout=PT1S

# --- AWS ---
cetus.aws.region=${AWS_REGION:us-east-1}
cetus.aws.kms-key-id=${CETUS_KMS_KEY_ID:alias/cetus}
cetus.storage.bucket=${CETUS_DOCUMENTS_BUCKET:cetus-documents}
%dev.cetus.aws.endpoint-override=http://localhost:4566

# --- Tests: fresh Postgres from Dev Services migrated by Flyway (test-only dependency), no job polling
# (tests drive the handlers), and a short DIAN timeout so the timeout scenarios run fast. KMS and S3
# are replaced by fakes; the DIAN TEST endpoint is a local fake set by FakeDianResource.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.schemas=billing
%test.quarkus.scheduler.enabled=false
%test.quarkus.http.test-port=0
%test.cetus.dian.request-timeout=PT1S
