quarkus.application.name=cetus-worker
quarkus.http.port=${PORT:8081}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
# Not set for %test, which gets its own database from Dev Services.
%dev,prod.quarkus.datasource.jdbc.url=${CETUS_DB_URL:jdbc:postgresql://localhost:5432/cetus}
%dev,prod.quarkus.datasource.username=${CETUS_DB_USER:cetus_billing}
%dev,prod.quarkus.datasource.password=${CETUS_DB_PASSWORD:cetus}
quarkus.datasource.jdbc.max-size=10
quarkus.hibernate-orm.database.default-schema=billing
quarkus.hibernate-orm.database.generation=none

# --- Job runner ---
cetus.jobs.poll-interval=2s
cetus.jobs.batch-size=5
cetus.jobs.lease=PT5M

# --- DIAN ---
cetus.dian.connect-timeout=PT10S
cetus.dian.request-timeout=PT60S
# Points the TEST environment to the local mock: CETUS_DIAN_TEST_URL=http://localhost:8090/WcfDianCustomerServices.svc
cetus.dian.test-url=${CETUS_DIAN_TEST_URL:}
# Technology provider data. Leave empty while operating as "software propio".
# cetus.provider.nit=
# cetus.provider.check-digit=
# cetus.provider.file-code=

# --- AWS ---
cetus.aws.region=${AWS_REGION:us-east-1}
cetus.aws.kms-key-id=${CETUS_KMS_KEY_ID:alias/cetus}
cetus.storage.bucket=${CETUS_DOCUMENTS_BUCKET:cetus-documents}
%dev.cetus.aws.endpoint-override=http://localhost:4566

# --- Tests: fresh Postgres from Dev Services migrated by Flyway (test-only dependency), no job polling
# (tests drive the handlers), and a short DIAN timeout so the timeout scenarios run fast. KMS and S3
# are replaced by fakes; the DIAN TEST endpoint is a local fake set by FakeDianResource.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.schemas=billing
%test.quarkus.scheduler.enabled=false
%test.quarkus.http.test-port=0
%test.cetus.dian.request-timeout=PT1S
