quarkus.application.name=cetus-worker
quarkus.http.port=${PORT:8081}
# Railway's private network is IPv6: listen on every interface (dual stack) in production.
%prod.quarkus.http.host=::
# JSON logs in production so Railway can filter by level and logger; plain text locally and in tests.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
# Railway's output only keeps warnings and errors, enough for a failed start; every level goes to Grafana (OTLP).
%prod.quarkus.log.console.level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.agroal".level=WARN
quarkus.log.category."software.amazon.awssdk".level=WARN

# --- Telemetry: traces, metrics and logs over OTLP (Grafana Cloud in production; grafana/otel-lgtm locally,
# `mise run infra-otel`). Production sets QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT and _HEADERS (write-only token).
# AGENTS.md (Telemetry) lists the attributes allowed in metrics and the data that never goes in telemetry.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
quarkus.otel.resource.attributes=service.version=${RAILWAY_GIT_COMMIT_SHA:dev},deployment.environment.name=${CETUS_DEPLOYMENT_ENV:development}
quarkus.otel.logs.enabled=true
# Follows the caller's decision; of the rest, keeps this share.
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${CETUS_OTEL_TRACE_RATIO:0.25}
quarkus.micrometer.binder.jvm=true
# Off locally unless the LGTM container is up, so dev mode does not log failed exports. Both services share that
# container instead of each starting its own Dev Service.
quarkus.observability.devservices.enabled=false
%dev.quarkus.otel.sdk.disabled=${CETUS_OTEL_DISABLED:true}
%dev.quarkus.otel.metric.export.interval=10s
%dev.quarkus.otel.traces.sampler.arg=1.0
%test.quarkus.otel.sdk.disabled=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
# Not set for %test, which gets its own database from Dev Services.
%dev,prod.quarkus.datasource.jdbc.url=${CETUS_DB_URL:jdbc:postgresql://localhost:5432/cetus}
%dev,prod.quarkus.datasource.username=${CETUS_DB_USER:cetus_billing}
%dev,prod.quarkus.datasource.password=${CETUS_DB_PASSWORD:cetus}
# Each running job holds at most one connection at a time (its transactions are short and sequential), plus
# the claims and the alerts. Keep it at least cetus.jobs.concurrency + 4: when the CPU saturates, transactions
# stretch and jobs beyond the pool wait for connections and fail. JobListener opens its own, outside it.
# In production CETUS_DB_URL goes through PlanetScale's PgBouncer (port 6432, transaction mode), so this pool
# does not count against the few direct connections; the advisory lock of OpsAlerts lives in its transaction.
quarkus.datasource.jdbc.max-size=${CETUS_DB_POOL_SIZE:20}
# Opening a connection to the database (TLS + SCRAM) costs hundreds of ms: keep some open, even when idle,
# so the first job after a quiet spell does not pay for it.
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2
quarkus.hibernate-orm.database.default-schema=billing
quarkus.hibernate-orm.schema-management.strategy=none

# --- Job runner ---
# Jobs running at once. Most of a job is waiting on the DIAN, S3 or the database, so on one vCPU several
# overlap. Raising it needs quarkus.datasource.jdbc.max-size raised with it.
cetus.jobs.concurrency=${CETUS_JOBS_CONCURRENCY:12}
# At most this many of one type at once (JobRunner), so no type takes every slot. Unset: the total.
# Documents and test set checks wait on the DIAN: a slow DIAN holds only these slots, and it is not flooded.
# Documents per second ≈ the PROCESS_DOCUMENT limit / the DIAN's response time, up to the CPU (~60/s with an
# instant DIAN, bench/README.md).
cetus.jobs.limit.PROCESS_DOCUMENT=${CETUS_JOBS_LIMIT_PROCESS_DOCUMENT:8}
cetus.jobs.limit.CHECK_TEST_SET_STATUS=2
cetus.jobs.limit.VERIFY_NUMBERING_RANGE=1
# Deliveries render the PDF (CPU) and email through Resend (10 requests/s per team by default).
cetus.jobs.limit.DELIVER_DOCUMENT=${CETUS_JOBS_LIMIT_DELIVER_DOCUMENT:2}
# Notices to the accounts' contacts: few, and they share Resend's rate limit with the deliveries.
cetus.jobs.limit.SEND_NOTIFICATION=1
# Integrators' endpoints can be slow (10 s timeout): a few of them must not hold every slot.
cetus.jobs.limit.DELIVER_WEBHOOK=${CETUS_JOBS_LIMIT_DELIVER_WEBHOOK:4}
# The safety net: picks up delayed jobs, retries and expired leases, and everything when not listening.
cetus.jobs.poll-interval=${CETUS_JOBS_POLL_INTERVAL:2s}
cetus.jobs.lease=PT5M
# Start jobs the moment they are enqueued (LISTEN/NOTIFY) instead of on the next poll.
cetus.jobs.listen=true
# LISTEN needs a direct connection: set this when CETUS_DB_URL goes through PgBouncer (PlanetScale's port
# 6432), e.g. the same URL on port 5432. It is the worker's only direct connection. Empty: the datasource's URL.
cetus.jobs.listen-url=${CETUS_JOBS_LISTEN_URL:}

# --- DIAN ---
cetus.dian.connect-timeout=PT10S
cetus.dian.request-timeout=PT60S
# Points the TEST environment to the local mock: CETUS_DIAN_TEST_URL=http://localhost:8090/WcfDianCustomerServices.svc
cetus.dian.test-url=${CETUS_DIAN_TEST_URL:}

# --- Sandbox ---
# SANDBOX documents are answered by a simulator and built with these credentials instead of the issuer's.
# None of them is secret: the Software ID and PIN are made up and the technical key is the one every
# habilitación range shares; each issuer gets a PIN and a technical key derived from them, so CUFEs stay
# unique. The certificate is Cetus' self-signed sandbox signer, sealed in the bucket.
cetus.sandbox.software-id=${CETUS_SANDBOX_SOFTWARE_ID:5a4db0c0-0000-4000-8000-000000000001}
cetus.sandbox.pin=${CETUS_SANDBOX_PIN:10101}
cetus.sandbox.technical-key=${CETUS_SANDBOX_TECHNICAL_KEY:fc8eac422eba16e22ffd8c6f94b3f40a6e38162c}
cetus.sandbox.certificate.s3-key=${CETUS_SANDBOX_CERTIFICATE_KEY:certificates/sandbox/cetus-sandbox.p12.sealed}
cetus.sandbox.certificate.password-s3-key=${CETUS_SANDBOX_CERTIFICATE_PASSWORD_KEY:certificates/sandbox/cetus-sandbox.password.sealed}
# A SANDBOX document is emailed to the account's technical contact, at most this many a day per account.
cetus.sandbox.daily-emails=${CETUS_SANDBOX_DAILY_EMAILS:30}
# Local runs: LocalStack starts empty, so the worker stores the test signer as the sandbox certificate
# (SandboxCertificateSeed). Never set in production. Relative to apps/worker, where dev mode runs.
%dev.cetus.sandbox.certificate.seed-file=../dian-mock/src/test/resources/test-signer.p12
%dev.cetus.sandbox.certificate.seed-password=cetus-test
# Technology provider data. Leave empty while operating as "software propio".
# cetus.provider.nit=
# cetus.provider.check-digit=
# cetus.provider.file-code=

# --- Delivery to the customer (Resend) ---
# Secrets only come from the environment: RESEND_API_KEY (send-only key, one per environment) and the
# sender, e.g. CETUS_EMAIL_FROM="Facturas <facturas@facturas.example.com>". Without both, deliveries are
# SKIPPED. In dev mode Quarkus also reads them from apps/worker/.env (git-ignored, see .env.example).
cetus.email.resend.api-key=${RESEND_API_KEY:}
cetus.email.resend.base-url=https://api.resend.com
cetus.email.from=${CETUS_EMAIL_FROM:}
# TEST documents go to this mailbox instead of the customer; without it they are not emailed.
cetus.email.test-recipient=${CETUS_EMAIL_TEST_RECIPIENT:}
cetus.email.connect-timeout=PT10S
cetus.email.read-timeout=PT30S
# Resend answers 429 above its rate limit without a Retry-After the SDK exposes; wait this long.
cetus.email.rate-limit-delay=PT2S
# Printed on the PDF. cetus.provider.name defaults to the issuer ("software propio").
cetus.provider.software-name=Cetus
# cetus.provider.name=

# --- Notices to the accounts' contacts (emailed with the same Resend settings) ---
# Links in the notices point to the console, e.g. CETUS_CONSOLE_URL=https://console.example.com
cetus.console.url=${CETUS_CONSOLE_URL:http://localhost:3000}
# Sender of the notices, e.g. "Cetus <avisos@example.com>". Unset: CETUS_EMAIL_FROM.
cetus.notifications.from=${CETUS_NOTIFICATIONS_FROM:}
# A failing webhook endpoint is notified once it reaches this many consecutive failed attempts.
cetus.webhooks.failing-notice-after=10
# Every day at 8:00 (Bogotá): expiring certificates and resolutions, ranges running out, rejections.
cetus.account-health.cron=0 0 8 * * ?
# Rejections of the previous day are notified when there were at least this many, at this share or more.
cetus.account-health.rejections-min=5
cetus.account-health.rejections-rate=0.20

# --- Webhooks to integrators ---
cetus.webhooks.connect-timeout=PT5S
cetus.webhooks.request-timeout=PT10S
# Endpoints resolving to loopback, private or link-local addresses are refused (SSRF), except in
# development and tests, where receivers run on localhost.
cetus.webhooks.allow-private-targets=false
%dev,test.cetus.webhooks.allow-private-targets=true
%test.cetus.webhooks.request-timeout=PT1S
# An endpoint failing for this long, with at least this many failed attempts and no 2xx in between, is
# disabled (reason AUTOMATIC) until the integrator enables it again from the console.
cetus.webhooks.auto-disable.after=P3D
cetus.webhooks.auto-disable.min-failures=10

# --- Operational alerts (emailed with the same Resend settings) ---
# Without a recipient the alerts are only logged (WARN).
cetus.alerts.recipient=${CETUS_OPS_ALERT_EMAIL:}
# Dead jobs, stuck documents and ranges the DIAN does not recognize.
cetus.alerts.check-interval=5m
# Certificates and numbering ranges, every day at 7:00 (Bogotá).
cetus.alerts.daily-cron=0 0 7 * * ?
# A condition that persists is emailed again after this long.
cetus.alerts.repeat-after=PT24H
# A document still waiting for the DIAN after this long is stuck.
cetus.alerts.stuck-after=PT15M
# Certificates and ranges expiring within this window, and ranges with less than this share left.
cetus.alerts.expiry-window=P30D
cetus.alerts.range-min-available=0.10

# --- Data retention (DataRetention), every day at 3:30 (Bogotá), in batches ---
cetus.retention.cron=0 30 3 * * ?
# One row per /v1 request; the console shows the last 24 hours.
cetus.retention.api-key-requests=${CETUS_RETENTION_API_KEY_REQUESTS:P30D}
cetus.retention.done-jobs=${CETUS_RETENTION_DONE_JOBS:P7D}
# Notices emailed to the accounts' contacts (notification_log): a year. At least 31 days (shorter values are
# raised to it): a 30-day expiry notice must outlive the days it is requested again.
cetus.retention.notifications=${CETUS_RETENTION_NOTIFICATIONS:P365D}
# SANDBOX documents, their records and their files: practice documents without fiscal value.
cetus.retention.sandbox-documents=${CETUS_RETENTION_SANDBOX_DOCUMENTS:P10D}
cetus.retention.batch-size=5000

# --- AWS ---
cetus.aws.region=${AWS_REGION:us-east-1}
cetus.aws.kms-key-id=${CETUS_KMS_KEY_ID:alias/cetus}
cetus.storage.bucket=${CETUS_DOCUMENTS_BUCKET:cetus-documents}
%dev.cetus.aws.endpoint-override=http://localhost:4566
# Documents and DIAN responses are locked (S3 Object Lock, compliance mode) for this many days. It cannot
# be shortened afterwards: try the bucket with CETUS_STORAGE_RETENTION_DAYS=1 before using the default
# (5 years). Unset in development and tests, so local objects stay deletable.
%prod.cetus.storage.retention-days=${CETUS_STORAGE_RETENTION_DAYS:1826}

# --- Tests: fresh Postgres from Dev Services migrated by Flyway (test-only dependency), no job polling or
# listening (tests drive the handlers), and a short DIAN timeout so the timeout scenarios run fast. KMS and S3
# are replaced by fakes; the DIAN TEST endpoint is a local fake set by FakeDianResource.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:18
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.schemas=billing
%test.quarkus.scheduler.enabled=false
%test.cetus.jobs.listen=false
%test.quarkus.http.test-port=0
%test.cetus.dian.request-timeout=PT1S
%test.cetus.alerts.recipient=ops@cetus.test
# Small batches, so the tests go through several of them.
%test.cetus.retention.batch-size=2
# Below the total, so JobRunnerTest sees the type's limit at work.
%test.cetus.jobs.limit.PROCESS_DOCUMENT=3
# Two, so SandboxProcessingTest reaches the daily limit of SANDBOX emails.
%test.cetus.sandbox.daily-emails=2
