packages:
  - "apps/console"
  - "apps/docs"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
# Only resolve versions published at least a week ago (in minutes), so a compromised release has time to be pulled.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - body-parser@2.4.0
  - undici@7.30.1
  - fast-uri@3.1.9
  - yaml@1.10.3
  - js-yaml@4.3.2
  - "auth@1.7.16"
  - "better-auth@1.7.16"
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - better-call@1.4.5
# Install scripts run only for these packages (pnpm 10 blocks the rest).
onlyBuiltDependencies:
  - esbuild
