# Local development: Postgres (both schemas) + LocalStack (KMS and S3).
# The apps run on the host: make dev (scripts/dev.sh) starts these containers and every app in one terminal.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cetus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
      # Postgres 18 keeps its data under /var/lib/postgresql/18; a new volume, since 16's data does not upgrade in place.
      - postgres18-data:/var/lib/postgresql

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: kms,s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack:/etc/localstack/init/ready.d:ro

volumes:
  postgres18-data:
