# Local development tools and shortcuts. `mise install` gets the tools, `mise tasks` lists the shortcuts.
# The heavy lifting lives in scripts/dev.sh and bench/bench.sh.

[tools]
java = "temurin-25.0.5+8.0.LTS"
node = "24.22.1"
# Same as package.json#packageManager.
pnpm = "10.34.7"
# Load generator for bench/.
k6 = "2.3.0"
# Public tunnel to the local API, for Wompi's events (mise run tunnel). Taken before its 7 days by choice: the
# tunnel warns that older releases are outdated.
cloudflared = "2026.10.7"
# Security scanner (mise run security-scan). Installed through mise, which checks its checksum, rather than
# aquasecurity/trivy-action or setup-trivy: their tags were hijacked in March 2026.
"aqua:aquasecurity/trivy" = "0.76.2"

[tasks.setup]
description = "First-time setup: pnpm install, containers, auth migrations, Java build"
run = "scripts/dev.sh setup"

[tasks.dev]
description = "Start infra + console, API and worker in this terminal (Ctrl+C stops them)"
run = "scripts/dev.sh"

[tasks.dev-mock]
description = "Same as dev, plus the DIAN mock with the worker pointing at it"
run = "scripts/dev.sh --mock"

[tasks.console]
description = "Start only the console (:3000)"
run = "scripts/dev.sh console"

[tasks.api]
description = "Start only the API (:8080)"
run = "scripts/dev.sh api"

[tasks.worker]
description = "Start only the worker (:8081)"
run = "scripts/dev.sh worker"

[tasks.mock]
description = "Start only the DIAN mock (:8090)"
run = "scripts/dev.sh mock"

[tasks.tunnel]
description = "Public HTTPS URL for Wompi's sandbox events to the local API: the named tunnel CETUS_TUNNEL, else a quick one"
run = """
if [ -n "${CETUS_TUNNEL:-}" ]; then
  cloudflared tunnel --no-autoupdate --config infra/cloudflared/dev.yml run "$CETUS_TUNNEL"
else
  cloudflared tunnel --no-autoupdate --url http://localhost:8080
fi
"""

[tasks.api-native]
description = "Build the API as a native binary with Mandrel in a container (apps/api/build/*-runner); day-to-day work stays on the JVM"
run = """
./gradlew :apps:api:build -x test --console=plain \
  -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false \
  -Dquarkus.native.container-build=true \
  -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:25.0.5.0-Final-java25-2026-11-08
"""

[tasks.api-native-test]
description = "Build the native API and run src/native-test against it (Postgres and LocalStack in containers)"
run = """
./gradlew :apps:api:testNative --console=plain \
  -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false \
  -Dquarkus.native.container-build=true \
  -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:25.0.5.0-Final-java25-2026-11-08
"""

[tasks.infra]
description = "Start Postgres and LocalStack and wait until they are ready"
run = "scripts/dev.sh infra"

[tasks.infra-otel]
description = "Start Grafana with OTLP (:3002); run the services with CETUS_OTEL_DISABLED=false to export to it"
run = "docker compose --profile observability up -d otel-lgtm"

[tasks.grafana-sync]
description = "Publish infra/grafana (dashboards and alert rules) to a Grafana; local :3002 by default"
run = "node scripts/grafana-sync.mjs"

[tasks.infra-down]
description = "Stop the containers (the Postgres volume is kept)"
run = "docker compose --profile observability down"

[tasks.infra-logs]
description = "Follow the container logs"
run = "docker compose logs -f"

[tasks.migrate]
description = "Apply the console's auth-schema migrations (Flyway runs when the API starts)"
run = "pnpm --filter @cetus/console db:migrate"

[tasks.fmt]
description = "Format the Java (palantir-java-format), console and docs (oxfmt) code"
run = ["./gradlew spotlessApply --console=plain", "pnpm --filter @cetus/console format", "pnpm --filter @cetus/docs format"]

[tasks.fmt-check]
description = "Check the Java, console and docs formatting without changing files"
run = ["./gradlew spotlessCheck --console=plain", "pnpm --filter @cetus/console format:check", "pnpm --filter @cetus/docs format:check"]

[tasks.docs]
description = "Start the docs site (:3001); VITE_API_URL=http://localhost:8080 points its reference at a local API"
run = "pnpm --filter @cetus/docs dev"

[tasks.docs-spec]
description = "Build the API's OpenAPI spec and write its public part (/v1) for the docs site"
run = ["./gradlew :apps:api:build -x test --console=plain", "node scripts/openapi-public.mjs"]

[tasks.security-scan]
description = "Scan dependencies, secrets and Dockerfiles with Trivy, as the Security check does on every PR"
run = "scripts/security-scan.sh repo"

[tasks.security-scan-images]
description = "Build the production images and scan them with Trivy, e.g. mise run security-scan-images worker; the API's native build takes ~8 GB of Docker memory"
usage = 'arg "[app]" help="api, worker or console; all three when omitted"'
run = 'scripts/security-scan.sh images ${usage_app:-}'

[tasks.gradle-locks]
description = "Rewrite the Gradle lockfiles after changing a Java dependency"
run = "./gradlew resolveDependencies --write-locks --console=plain"

[tasks.test-console]
description = "Console integration (Vitest) and e2e (Playwright) tests; needs `mise run dev-mock` running"
run = "pnpm --filter @cetus/console test"

[tasks.bench-up]
description = "Benchmark: build and start the production images with Railway's limits (bench/README.md)"
run = "bench/bench.sh up"

[tasks.bench-seed]
description = "Benchmark: create tenants and a document history in the benchmark stack"
run = "bench/bench.sh seed"

[tasks.bench]
description = "Benchmark: run a k6 scenario, e.g. PROFILE=load RATE=200 mise run bench public-api"
usage = 'arg "[scenario]" default="public-api"'
run = 'bench/bench.sh run "${usage_scenario}"'

[tasks.bench-coldstart]
description = "Benchmark: restart the API and the worker and load them cold, e.g. mise run bench-coldstart public-api"
usage = 'arg "[scenario]" default="public-api"'
run = 'bench/bench.sh coldstart "${usage_scenario}"'

[tasks.bench-down]
description = "Benchmark: stop the stack (its database volume is kept)"
run = "bench/bench.sh down"
