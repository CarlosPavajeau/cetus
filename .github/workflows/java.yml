# Builds every Java project and runs its tests. Quarkus Dev Services start a Postgres container for the API
# and worker tests, so the runner needs Docker and nothing else.
name: Java

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Filtered here rather than with `paths:` so the job always reports: a skipped job passes as a required check.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            java:
              - "apps/api/**"
              - "apps/worker/**"
              - "apps/dian-mock/**"
              - "modules/**"
              - "build-logic/**"
              - "gradle/**"
              - "gradlew"
              - "*.gradle.kts"
              - "gradle.properties"
              - "mise.toml"
              - ".github/workflows/java.yml"

  test:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew build

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
