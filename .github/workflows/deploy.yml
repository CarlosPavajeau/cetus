# Deploys to Railway in order, so the console never reaches production before the API it calls:
#   api → worker and console (in parallel)
# The API goes first because it migrates the billing schema (Flyway) and serves /console/* to the console.
# Each service deploys only when the push touched its files; run the workflow by hand to deploy all three.
# Railway does not deploy on push: autodeploy is off in each service, which builds from its GitHub source.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a rollout halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_CLI_VERSION: "5.70.0"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      worker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.worker == 'true' }}
      console: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            java: &java
              - modules/**
              - build-logic/**
              - gradle/**
              - gradlew
              - "*.gradle.kts"
              - gradle.properties
            api:
              - *java
              - apps/api/**
            worker:
              - *java
              - apps/worker/**
            console:
              - apps/console/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            docs:
              - apps/docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @railway/cli@${{ env.RAILWAY_CLI_VERSION }}
      - run: scripts/railway-deploy.sh api

  worker:
    needs: [changes, api]
    # Runs when the API was skipped (nothing changed there), never after a failed API deploy.
    if: always() && needs.changes.outputs.worker == 'true' && needs.api.result != 'failure' && needs.api.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @railway/cli@${{ env.RAILWAY_CLI_VERSION }}
      - run: scripts/railway-deploy.sh worker

  console:
    needs: [changes, api]
    if: always() && needs.changes.outputs.console == 'true' && needs.api.result != 'failure' && needs.api.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @railway/cli@${{ env.RAILWAY_CLI_VERSION }}
      - run: scripts/railway-deploy.sh console

  # A static site on Cloudflare Pages (project cetus-docs, cetus-docs.cantte.com). It only reads the public
  # spec committed in apps/docs, so it does not wait for the API.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the static site
        run: pnpm --filter @cetus/docs build

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The wrangler of apps/docs, from the lockfile: the action would otherwise add it to the workspace root.
          workingDirectory: apps/docs
          wranglerVersion: "4.151.1"
          command: pages deploy dist/client --project-name cetus-docs --branch main
