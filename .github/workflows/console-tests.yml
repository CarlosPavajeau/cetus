# Runs the console's integration (Vitest) and end-to-end (Playwright) tests against the whole local stack:
# Postgres and LocalStack in Docker, plus the console, API, worker and DIAN mock started by scripts/dev.sh,
# the same way `mise run dev-mock` does on a laptop.
name: Console tests

on:
  pull_request:
    paths:
      - "apps/**"
      - "modules/**"
      - "infra/**"
      - "scripts/dev.sh"
      - "docker-compose.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "build-logic/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - ".github/workflows/console-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # mise-action caches the tools, not pnpm's store.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the console's .env
        run: |
          sed "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" \
            apps/console/.env.example > apps/console/.env

      - name: Start Postgres and LocalStack
        run: scripts/dev.sh infra

      - name: Migrate the auth schema
        run: pnpm --filter @cetus/console db:migrate

      - name: Start the console, API, worker and DIAN mock
        run: |
          mkdir -p .logs
          nohup scripts/dev.sh --mock --no-infra > .logs/dev.log 2>&1 &

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # While the Java apps compile and start.
      - name: Install the Playwright browser
        run: pnpm --filter @cetus/console exec playwright install --with-deps chromium

      - name: Wait for the stack
        run: |
          for i in $(seq 1 300); do
            if curl -sf http://localhost:3000/sign-in > /dev/null && curl -sf http://localhost:8080/q/health/ready > /dev/null; then
              echo "Stack ready after ${i}s"
              exit 0
            fi
            if ! pgrep -f scripts/dev.sh > /dev/null; then
              echo "::error::scripts/dev.sh exited before the stack was ready"
              tail -n 100 .logs/dev.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::The console or the API did not answer within 5 minutes"
          tail -n 100 .logs/dev.log
          exit 1

      - name: Integration tests
        run: pnpm --filter @cetus/console test:integration

      - name: End-to-end tests
        run: pnpm --filter @cetus/console test:e2e
        env:
          CI: true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          retention-days: 7

      - name: Upload the service logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-logs
          path: .logs/
          retention-days: 7
