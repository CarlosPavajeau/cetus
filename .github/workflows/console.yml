# Checks the console with Vite+: formatting (Oxfmt), lint (Oxlint) and type checking in one `vp check`.
name: Console

on:
  pull_request:
    paths:
      - "apps/console/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - ".github/workflows/console.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml pins Node.js: vite.config.ts holds the lint and format config, and loading it needs >= 22.18.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # mise-action caches the tools, not pnpm's store.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: pnpm --filter @cetus/console check
