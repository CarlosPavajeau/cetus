# Keeps the console in sync with the API contract: the TypeScript types in schema.d.ts are generated
# from the OpenAPI spec that Quarkus builds from the Java DTOs.
name: API contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # mise-action caches the tools, not pnpm's store.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the API and its OpenAPI spec
        run: ./gradlew :apps:api:build -x test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript types from the spec
        run: pnpm --filter @cetus/console api:types:file

      - name: Check that schema.d.ts is up to date
        run: |
          if ! git diff --exit-code apps/console/src/lib/api/schema.d.ts; then
            echo "::error file=apps/console/src/lib/api/schema.d.ts::schema.d.ts does not match the API's OpenAPI spec. Run './gradlew :apps:api:build -x test' and 'pnpm --filter @cetus/console api:types:file', then commit the result."
            exit 1
          fi

      - name: Typecheck the console
        run: pnpm --filter @cetus/console typecheck
