# Checks the docs site with Vite+ (formatting, lint and types) and builds it: the build prerenders every page
# and fails on a broken internal link. Each pull request also gets a preview on Cloudflare Pages.
name: Docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Filtered here rather than with `paths:` so the job always reports: a skipped job passes as a required check.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - "apps/docs/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "mise.toml"
              - ".github/workflows/docs.yml"

  build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # mise-action caches the tools, not pnpm's store.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: pnpm --filter @cetus/docs check

      - name: Build the static site
        run: pnpm --filter @cetus/docs build

      # Branch deployments of the Pages project are previews; production is the main branch (deploy.yml).
      # Pull requests from forks get no secrets, so they get no preview.
      - name: Deploy a preview
        id: preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The wrangler of apps/docs, from the lockfile: the action would otherwise add it to the workspace root.
          workingDirectory: apps/docs
          wranglerVersion: "4.151.1"
          command: pages deploy dist/client --project-name cetus-docs --branch ${{ github.head_ref }}

      - name: Link the preview
        if: steps.preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          echo "Vista previa de la documentación: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
