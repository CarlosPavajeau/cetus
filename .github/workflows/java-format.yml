# Formatting is checked here rather than by `check`, since the Docker images run `build`.
name: Java format

on:
  pull_request:
    paths:
      - "**/*.java"
      - "**/*.gradle.kts"
      - "build-logic/**"
      - "gradle/**"
      - "mise.toml"
      - ".github/workflows/java-format.yml"

permissions:
  contents: read

jobs:
  spotless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check the formatting
        run: ./gradlew spotlessCheck
